services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cloudpulse-backend:aws
    container_name: cloudpulse-backend
    restart: unless-stopped

    env_file:
      - .env.aws

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      CORS_ALLOWED_ORIGINS: "https://16.178.228.216,http://16.178.228.216,http://localhost:5173,http://localhost:5174,http://localhost:3000"
      DB_POOL_MAX: 8
      DB_POOL_MIN: 2

      # AWS RDS PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/${RDS_DB_NAME}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${RDS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RDS_DB_PASSWORD}

      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}

      # Gmail SMTP
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      APP_NOTIFICATION_FROM: ${APP_NOTIFICATION_FROM}

      # Security
      SSRF_PROTECTION_ENABLED: "true"
      SSRF_ALLOW_PRIVATE_IPS: "false"

      # Production error handling and logging
      SERVER_ERROR_INCLUDE_MESSAGE: never
      SERVER_ERROR_INCLUDE_BINDING_ERRORS: never
      LOGGING_LEVEL_COM_CLOUDPULSE: INFO

    ports:
      - "127.0.0.1:8081:8081"

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 320M

    networks:
      - cloudpulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cloudpulse-frontend:aws
    container_name: cloudpulse-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "127.0.0.1:5174:80"

    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

    networks:
      - cloudpulse-network

networks:
  cloudpulse-network:
    driver: bridge
